<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f5f7">

  <title>通院メモ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
    }

    header {
      background: white;
      padding: 24px 20px 18px;
      border-bottom: 1px solid #ddd;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    main {
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .hospital-card {
      cursor: pointer;
    }

    .hospital-name {
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .department {
      color: #777;
      margin-bottom: 16px;
    }

    .label {
      font-size: 13px;
      color: #777;
      margin-bottom: 5px;
    }

    .value {
      font-size: 17px;
      line-height: 1.6;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    .number {
      font-size: 22px;
      font-weight: bold;
    }

    .section {
      margin-bottom: 18px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      margin-top: 8px;
      background: #007aff;
      color: white;
    }

    button.secondary {
      background: #e9e9ee;
      color: #333;
    }

    button.danger {
      background: #ffe5e5;
      color: #d00;
    }

    button.copy {
      width: auto;
      padding: 8px 12px;
      margin: 0 0 0 8px;
      font-size: 14px;
      background: #e8f1ff;
      color: #007aff;
    }

    .card-number-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 20px 0;
    }

    .action-grid button {
      margin: 0;
      min-height: 54px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      background: white;
      margin-bottom: 15px;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 30px 10px;
      line-height: 1.7;
    }

    .hidden {
      display: none !important;
    }

    .back {
      color: #007aff;
      margin-bottom: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .unavailable {
      opacity: 0.4;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 35px;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 14px;
      z-index: 100;
    }

    .status {
      padding: 14px;
      border-radius: 14px;
      margin-bottom: 20px;
      font-weight: bold;
      line-height: 1.6;
    }

    .status.open {
      background: #e8f7ed;
      color: #16763a;
    }

    .status.wait {
      background: #fff5d6;
      color: #8a6500;
    }

    .status.closed {
      background: #ffe9e9;
      color: #b42323;
    }

    .status.unknown {
      background: #eeeeee;
      color: #555;
    }

    .schedule-day {
      border-top: 1px solid #e5e5e5;
      padding: 16px 0;
    }

    .schedule-day:first-child {
      border-top: none;
    }

    .day-title {
      font-weight: bold;
      font-size: 17px;
      margin-bottom: 10px;
    }

    .closed-check {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .closed-check input {
      width: auto;
      margin: 0;
    }

    .time-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .time-row input {
      margin: 0;
    }

    .schedule-display {
      line-height: 1.8;
    }
  </style>
</head>

<body>

<header>
  <h1>通院メモ</h1>
</header>

<main>

  <div id="listView">

    <div id="hospitalList"></div>

    <div id="emptyView" class="card hidden">
      <div class="empty">
        まだ病院が登録されていません。<br>
        下のボタンから登録してください。
      </div>
    </div>

    <button onclick="showForm()">
      ＋ 病院を追加
    </button>

  </div>


  <div id="detailView" class="hidden">

    <div class="back" onclick="showList()">
      ← 一覧に戻る
    </div>

    <div class="card">

      <div class="hospital-name" id="detailHospitalName"></div>
      <div class="department" id="detailDepartment"></div>

      <div id="receptionStatus" class="status unknown">
        受付時間が設定されていません
      </div>

      <div class="section">
        <div class="label">診察券番号</div>

        <div class="card-number-row">
          <div class="value number" id="detailCardNumber"></div>

          <button
            class="copy"
            id="copyButton"
            onclick="copyCardNumber()">
            コピー
          </button>
        </div>
      </div>

      <div class="action-grid">

        <button id="phoneButton" onclick="callHospital()">
          📞 電話
        </button>

        <button id="mapButton" onclick="openMap()">
          🗺 地図
        </button>

        <button id="webButton" onclick="openWebsite()">
          🌐 Webサイト
        </button>

        <button onclick="editHospital()">
          ✏️ 編集
        </button>

      </div>

      <div class="section">
        <div class="label">通常の受付時間</div>
        <div class="value schedule-display" id="detailSchedule"></div>
      </div>

      <div class="section">
        <div class="label">電話番号</div>
        <div class="value" id="detailPhone"></div>
      </div>

      <div class="section">
        <div class="label">住所</div>
        <div class="value" id="detailAddress"></div>
      </div>

      <div class="section">
        <div class="label">次回予約</div>
        <div class="value" id="detailAppointment"></div>
      </div>

      <div class="section">
        <div class="label">メモ</div>
        <div class="value" id="detailMemo"></div>
      </div>

      <button class="danger" onclick="deleteHospital()">
        登録情報を削除
      </button>

    </div>

  </div>


  <div id="formView" class="hidden">

    <div class="back" onclick="cancelForm()">
      ← 戻る
    </div>

    <div class="card">

      <h2 id="formTitle">病院を登録</h2>

      <div class="label">病院名</div>
      <input id="hospitalName" type="text" placeholder="例：〇〇眼科">

      <div class="label">診療科</div>
      <input id="department" type="text" placeholder="例：眼科">

      <div class="label">診察券番号</div>
      <input id="cardNumber" type="text" inputmode="numeric">

      <div class="label">電話番号</div>
      <input id="phone" type="tel" placeholder="例：096-000-0000">

      <div class="label">住所</div>
      <input id="address" type="text" placeholder="例：熊本県熊本市〇〇">

      <div class="label">Webサイト</div>
      <input
        id="website"
        type="url"
        inputmode="url"
        autocapitalize="none"
        placeholder="https://example.com">

      <div class="label">次回予約</div>
      <input id="appointment" type="datetime-local">

      <div class="label">メモ</div>
      <textarea id="memo"></textarea>

    </div>


    <div class="card">

      <h2>通常の受付時間</h2>

      <p style="color:#777; line-height:1.6;">
        曜日ごとに受付時間を設定します。
        休診日は「休診」にチェックしてください。
      </p>

      <div id="scheduleForm"></div>

    </div>


    <button onclick="saveHospital()">
      💾 保存する
    </button>

    <button class="secondary" onclick="cancelForm()">
      キャンセル
    </button>

  </div>

</main>

<div id="toast" class="toast hidden"></div>


<script>

const STORAGE_KEY = "hospitalMemoList";

const dayNames = [
  "日曜日",
  "月曜日",
  "火曜日",
  "水曜日",
  "木曜日",
  "金曜日",
  "土曜日"
];

let selectedIndex = null;


function getHospitals() {

  const saved =
    localStorage.getItem(STORAGE_KEY);

  if (!saved) return [];

  try {
    return JSON.parse(saved);
  } catch {
    return [];
  }

}


function saveHospitals(hospitals) {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(hospitals)
  );

}


function createEmptySchedule() {

  return dayNames.map(function() {

    return {
      closed: false,
      morningStart: "",
      morningEnd: "",
      afternoonStart: "",
      afternoonEnd: ""
    };

  });

}


function createScheduleForm(schedule) {

  const container =
    document.getElementById("scheduleForm");

  container.innerHTML = "";

  dayNames.forEach(function(dayName, index) {

    const day =
      schedule[index] || {};

    const div =
      document.createElement("div");

    div.className = "schedule-day";

    div.innerHTML = `
      <div class="day-title">
        ${dayName}
      </div>

      <label class="closed-check">
        <input
          type="checkbox"
          id="closed-${index}"
          ${day.closed ? "checked" : ""}
          onchange="toggleDay(${index})">
        休診
      </label>

      <div id="times-${index}">

        <div class="label">午前</div>

        <div class="time-row">
          <input
            type="time"
            id="morningStart-${index}"
            value="${day.morningStart || ""}">

          <span>〜</span>

          <input
            type="time"
            id="morningEnd-${index}"
            value="${day.morningEnd || ""}">
        </div>

        <div class="label" style="margin-top:12px;">
          午後
        </div>

        <div class="time-row">
          <input
            type="time"
            id="afternoonStart-${index}"
            value="${day.afternoonStart || ""}">

          <span>〜</span>

          <input
            type="time"
            id="afternoonEnd-${index}"
            value="${day.afternoonEnd || ""}">
        </div>

      </div>
    `;

    container.appendChild(div);

    toggleDay(index);

  });

}


function toggleDay(index) {

  const closed =
    document.getElementById(
      "closed-" + index
    );

  const times =
    document.getElementById(
      "times-" + index
    );

  if (!closed || !times) return;

  times.style.display =
    closed.checked ? "none" : "block";

}


function readScheduleForm() {

  return dayNames.map(function(_, index) {

    return {

      closed:
        document.getElementById(
          "closed-" + index
        ).checked,

      morningStart:
        document.getElementById(
          "morningStart-" + index
        ).value,

      morningEnd:
        document.getElementById(
          "morningEnd-" + index
        ).value,

      afternoonStart:
        document.getElementById(
          "afternoonStart-" + index
        ).value,

      afternoonEnd:
        document.getElementById(
          "afternoonEnd-" + index
        ).value

    };

  });

}


function showList() {

  selectedIndex = null;

  document.getElementById("listView")
    .classList.remove("hidden");

  document.getElementById("detailView")
    .classList.add("hidden");

  document.getElementById("formView")
    .classList.add("hidden");

  renderHospitalList();

}


function renderHospitalList() {

  const hospitals = getHospitals();

  const list =
    document.getElementById("hospitalList");

  list.innerHTML = "";

  document.getElementById("emptyView")
    .classList.toggle(
      "hidden",
      hospitals.length > 0
    );


  hospitals.forEach(function(hospital, index) {

    const card =
      document.createElement("div");

    card.className =
      "card hospital-card";


    const name =
      document.createElement("div");

    name.className =
      "hospital-name";

    name.textContent =
      "🏥 " + hospital.hospitalName;


    const department =
      document.createElement("div");

    department.className =
      "department";

    department.textContent =
      hospital.department || "";


    const label =
      document.createElement("div");

    label.className = "label";

    label.textContent =
      "診察券番号";


    const number =
      document.createElement("div");

    number.className = "value";

    number.textContent =
      hospital.cardNumber || "未登録";


    card.appendChild(name);
    card.appendChild(department);
    card.appendChild(label);
    card.appendChild(number);


    card.onclick = function() {
      showDetail(index);
    };


    list.appendChild(card);

  });

}


function showDetail(index) {

  const hospitals = getHospitals();

  const hospital =
    hospitals[index];

  if (!hospital) return;

  selectedIndex = index;


  document.getElementById("detailHospitalName")
    .textContent =
    "🏥 " + hospital.hospitalName;

  document.getElementById("detailDepartment")
    .textContent =
    hospital.department || "";

  document.getElementById("detailCardNumber")
    .textContent =
    hospital.cardNumber || "未登録";

  document.getElementById("detailPhone")
    .textContent =
    hospital.phone || "未登録";

  document.getElementById("detailAddress")
    .textContent =
    hospital.address || "未登録";

  document.getElementById("detailMemo")
    .textContent =
    hospital.memo || "なし";


  if (hospital.appointment) {

    const date =
      new Date(hospital.appointment);

    document.getElementById("detailAppointment")
      .textContent =
      date.toLocaleString(
        "ja-JP",
        {
          year: "numeric",
          month: "long",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        }
      );

  } else {

    document.getElementById("detailAppointment")
      .textContent =
      "未登録";

  }


  displaySchedule(hospital);

  updateReceptionStatus(hospital);


  setButtonState(
    "phoneButton",
    hospital.phone
  );

  setButtonState(
    "mapButton",
    hospital.address || hospital.hospitalName
  );

  setButtonState(
    "webButton",
    hospital.website
  );

  setButtonState(
    "copyButton",
    hospital.cardNumber
  );


  document.getElementById("listView")
    .classList.add("hidden");

  document.getElementById("detailView")
    .classList.remove("hidden");

  document.getElementById("formView")
    .classList.add("hidden");

}


function displaySchedule(hospital) {

  const target =
    document.getElementById(
      "detailSchedule"
    );

  if (
    !hospital.schedule ||
    !Array.isArray(hospital.schedule)
  ) {

    target.textContent =
      hospital.hours ||
      "未設定";

    return;

  }


  let text = "";

  hospital.schedule.forEach(
    function(day, index) {

      text += dayNames[index] + "　";

      if (day.closed) {

        text += "休診\n";
        return;

      }


      const sessions = [];


      if (
        day.morningStart &&
        day.morningEnd
      ) {

        sessions.push(
          day.morningStart +
          "〜" +
          day.morningEnd
        );

      }


      if (
        day.afternoonStart &&
        day.afternoonEnd
      ) {

        sessions.push(
          day.afternoonStart +
          "〜" +
          day.afternoonEnd
        );

      }


      text +=
        sessions.length
        ? sessions.join(" / ")
        : "設定なし";

      text += "\n";

    }
  );


  target.textContent = text;

}


function updateReceptionStatus(hospital) {

  const box =
    document.getElementById(
      "receptionStatus"
    );


  box.className =
    "status unknown";


  if (
    !hospital.schedule ||
    !Array.isArray(hospital.schedule)
  ) {

    box.textContent =
      "受付時間が設定されていません";

    return;

  }


  const now = new Date();

  const dayIndex =
    now.getDay();

  const today =
    hospital.schedule[dayIndex];


  if (!today) {

    box.textContent =
      "受付時間が設定されていません";

    return;

  }


  if (today.closed) {

    box.className =
      "status closed";

    box.textContent =
      "🔴 本日は休診です";

    return;

  }


  const current =
    now.getHours() * 60 +
    now.getMinutes();


  const morningStart =
    timeToMinutes(
      today.morningStart
    );

  const morningEnd =
    timeToMinutes(
      today.morningEnd
    );

  const afternoonStart =
    timeToMinutes(
      today.afternoonStart
    );

  const afternoonEnd =
    timeToMinutes(
      today.afternoonEnd
    );


  if (
    morningStart !== null &&
    morningEnd !== null &&
    current >= morningStart &&
    current <= morningEnd
  ) {

    box.className =
      "status open";

    box.textContent =
      "🟢 現在受付時間内です\n午前の受付は " +
      today.morningEnd +
      " まで";

    return;

  }


  if (
    afternoonStart !== null &&
    afternoonEnd !== null &&
    current >= afternoonStart &&
    current <= afternoonEnd
  ) {

    box.className =
      "status open";

    box.textContent =
      "🟢 現在受付時間内です\n午後の受付は " +
      today.afternoonEnd +
      " まで";

    return;

  }


  if (
    morningStart !== null &&
    current < morningStart
  ) {

    box.className =
      "status wait";

    box.textContent =
      "🟡 受付開始前です\n午前は " +
      today.morningStart +
      " から";

    return;

  }


  if (
    afternoonStart !== null &&
    current < afternoonStart
  ) {

    box.className =
      "status wait";

    box.textContent =
      "🟡 現在は受付時間外です\n午後は " +
      today.afternoonStart +
      " から";

    return;

  }


  box.className =
    "status closed";

  box.textContent =
    "🔴 本日の受付は終了しました";

}


function timeToMinutes(time) {

  if (!time) return null;

  const parts =
    time.split(":");

  return (
    Number(parts[0]) * 60 +
    Number(parts[1])
  );

}


function setButtonState(id, available) {

  const button =
    document.getElementById(id);

  button.disabled = !available;

  button.classList.toggle(
    "unavailable",
    !available
  );

}


function showForm() {

  selectedIndex = null;

  clearForm();

  document.getElementById("formTitle")
    .textContent =
    "病院を登録";

  createScheduleForm(
    createEmptySchedule()
  );

  document.getElementById("listView")
    .classList.add("hidden");

  document.getElementById("detailView")
    .classList.add("hidden");

  document.getElementById("formView")
    .classList.remove("hidden");

}


function editHospital() {

  const hospitals = getHospitals();

  const hospital =
    hospitals[selectedIndex];

  if (!hospital) return;


  document.getElementById("formTitle")
    .textContent =
    "病院情報を編集";


  document.getElementById("hospitalName")
    .value =
    hospital.hospitalName || "";

  document.getElementById("department")
    .value =
    hospital.department || "";

  document.getElementById("cardNumber")
    .value =
    hospital.cardNumber || "";

  document.getElementById("phone")
    .value =
    hospital.phone || "";

  document.getElementById("address")
    .value =
    hospital.address || "";

  document.getElementById("website")
    .value =
    hospital.website || "";

  document.getElementById("appointment")
    .value =
    hospital.appointment || "";

  document.getElementById("memo")
    .value =
    hospital.memo || "";


  createScheduleForm(
    hospital.schedule ||
    createEmptySchedule()
  );


  document.getElementById("detailView")
    .classList.add("hidden");

  document.getElementById("formView")
    .classList.remove("hidden");

}


function saveHospital() {

  const hospital = {

    hospitalName:
      document.getElementById("hospitalName")
      .value.trim(),

    department:
      document.getElementById("department")
      .value.trim(),

    cardNumber:
      document.getElementById("cardNumber")
      .value.trim(),

    phone:
      document.getElementById("phone")
      .value.trim(),

    address:
      document.getElementById("address")
      .value.trim(),

    website:
      document.getElementById("website")
      .value.trim(),

    appointment:
      document.getElementById("appointment")
      .value,

    memo:
      document.getElementById("memo")
      .value.trim(),

    schedule:
      readScheduleForm()

  };


  if (!hospital.hospitalName) {

    alert(
      "病院名を入力してください。"
    );

    return;

  }


  if (
    hospital.website &&
    !hospital.website.startsWith("http://") &&
    !hospital.website.startsWith("https://")
  ) {

    hospital.website =
      "https://" +
      hospital.website;

  }


  const hospitals =
    getHospitals();


  if (selectedIndex === null) {

    hospitals.push(hospital);

  } else {

    const oldHospital =
      hospitals[selectedIndex];

    hospitals[selectedIndex] = {
      ...oldHospital,
      ...hospital
    };

  }


  saveHospitals(hospitals);

  showList();

}


function deleteHospital() {

  if (selectedIndex === null) return;

  const answer =
    confirm(
      "この病院の登録情報を削除しますか？"
    );

  if (!answer) return;


  const hospitals =
    getHospitals();

  hospitals.splice(
    selectedIndex,
    1
  );

  saveHospitals(hospitals);

  showList();

}


function cancelForm() {

  if (selectedIndex !== null) {

    showDetail(selectedIndex);

  } else {

    showList();

  }

}


function clearForm() {

  document.getElementById("hospitalName").value = "";
  document.getElementById("department").value = "";
  document.getElementById("cardNumber").value = "";
  document.getElementById("phone").value = "";
  document.getElementById("address").value = "";
  document.getElementById("website").value = "";
  document.getElementById("appointment").value = "";
  document.getElementById("memo").value = "";

}


function getSelectedHospital() {

  const hospitals =
    getHospitals();

  if (
    selectedIndex === null
  ) return null;

  return (
    hospitals[selectedIndex] ||
    null
  );

}


async function copyCardNumber() {

  const hospital =
    getSelectedHospital();

  if (
    !hospital ||
    !hospital.cardNumber
  ) return;


  try {

    await navigator.clipboard.writeText(
      hospital.cardNumber
    );

    showToast(
      "診察券番号をコピーしました"
    );

  } catch {

    const textarea =
      document.createElement("textarea");

    textarea.value =
      hospital.cardNumber;

    document.body.appendChild(
      textarea
    );

    textarea.select();

    document.execCommand(
      "copy"
    );

    textarea.remove();

    showToast(
      "診察券番号をコピーしました"
    );

  }

}


function callHospital() {

  const hospital =
    getSelectedHospital();

  if (
    !hospital ||
    !hospital.phone
  ) return;


  const phone =
    hospital.phone.replace(
      /[^0-9+]/g,
      ""
    );

  window.location.href =
    "tel:" + phone;

}


function openMap() {

  const hospital =
    getSelectedHospital();

  if (!hospital) return;


  const destination =
    hospital.address
    ? hospital.hospitalName +
      " " +
      hospital.address
    : hospital.hospitalName;


  window.location.href =
    "https://maps.apple.com/?q=" +
    encodeURIComponent(
      destination
    );

}


function openWebsite() {

  const hospital =
    getSelectedHospital();

  if (
    !hospital ||
    !hospital.website
  ) return;


  window.open(
    hospital.website,
    "_blank"
  );

}


function showToast(message) {

  const toast =
    document.getElementById(
      "toast"
    );

  toast.textContent =
    message;

  toast.classList.remove(
    "hidden"
  );


  setTimeout(
    function() {

      toast.classList.add(
        "hidden"
      );

    },
    1800
  );

}


showList();
