<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f5f7">

  <title>通院メモ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
    }

    header {
      background: white;
      padding: 24px 20px 18px;
      border-bottom: 1px solid #ddd;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    main {
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .hospital-card {
      cursor: pointer;
    }

    .hospital-name {
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .department {
      color: #777;
      margin-bottom: 12px;
    }

    .label {
      font-size: 13px;
      color: #777;
      margin-bottom: 5px;
    }

    .value {
      font-size: 17px;
      line-height: 1.6;
      white-space: pre-line;
    }

    .number {
      font-size: 22px;
      font-weight: bold;
    }

    .section {
      margin-bottom: 18px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      margin-top: 8px;
      background: #007aff;
      color: white;
    }

    button.secondary {
      background: #e9e9ee;
      color: #333;
    }

    button.danger {
      background: #ffe5e5;
      color: #d00;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      background: white;
      margin-bottom: 15px;
    }

    textarea {
      min-height: 90px;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 30px 10px;
      line-height: 1.7;
    }

    .hidden {
      display: none;
    }

    .back {
      color: #007aff;
      margin-bottom: 18px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header>
  <h1>通院メモ</h1>
</header>

<main>

  <!-- 一覧画面 -->
  <div id="listView">

    <div id="hospitalList"></div>

    <div id="emptyView" class="card hidden">
      <div class="empty">
        まだ病院が登録されていません。<br>
        下のボタンから登録してください。
      </div>
    </div>

    <button onclick="showForm()">
      ＋ 病院を追加
    </button>

  </div>


  <!-- 詳細画面 -->
  <div id="detailView" class="hidden">

    <div class="back" onclick="showList()">
      ← 一覧に戻る
    </div>

    <div class="card">

      <div class="hospital-name" id="detailHospitalName"></div>
      <div class="department" id="detailDepartment"></div>

      <div class="section">
        <div class="label">診察券番号</div>
        <div class="value number" id="detailCardNumber"></div>
      </div>

      <div class="section">
        <div class="label">受付時間</div>
        <div class="value" id="detailHours"></div>
      </div>

      <div class="section">
        <div class="label">休診日</div>
        <div class="value" id="detailClosed"></div>
      </div>

      <div class="section">
        <div class="label">電話番号</div>
        <div class="value" id="detailPhone"></div>
      </div>

      <div class="section">
        <div class="label">次回予約</div>
        <div class="value" id="detailAppointment"></div>
      </div>

      <div class="section">
        <div class="label">メモ</div>
        <div class="value" id="detailMemo"></div>
      </div>

      <button onclick="editHospital()">
        ✏️ 編集
      </button>

      <button class="danger" onclick="deleteHospital()">
        登録情報を削除
      </button>

    </div>

  </div>


  <!-- 登録・編集画面 -->
  <div id="formView" class="hidden">

    <div class="back" onclick="cancelForm()">
      ← 戻る
    </div>

    <div class="card">

      <h2 id="formTitle">病院を登録</h2>

      <div class="label">病院名</div>
      <input id="hospitalName" type="text" placeholder="例：〇〇眼科">

      <div class="label">診療科</div>
      <input id="department" type="text" placeholder="例：眼科">

      <div class="label">診察券番号</div>
      <input id="cardNumber" type="text" inputmode="numeric">

      <div class="label">受付時間</div>
      <textarea id="hours" placeholder="例：
月・火・木・金
8:30〜12:30
14:00〜17:30"></textarea>

      <div class="label">休診日</div>
      <input id="closed" type="text" placeholder="例：水曜・日曜・祝日">

      <div class="label">電話番号</div>
      <input id="phone" type="tel" placeholder="例：096-000-0000">

      <div class="label">次回予約</div>
      <input id="appointment" type="datetime-local">

      <div class="label">メモ</div>
      <textarea id="memo"></textarea>

      <button onclick="saveHospital()">
        💾 保存する
      </button>

      <button class="secondary" onclick="cancelForm()">
        キャンセル
      </button>

    </div>

  </div>

</main>


<script>

  const STORAGE_KEY = "hospitalMemoList";

  let selectedIndex = null;


  function getHospitals() {

    const saved =
      localStorage.getItem(STORAGE_KEY);

    if (!saved) return [];

    return JSON.parse(saved);

  }


  function saveHospitals(hospitals) {

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(hospitals)
    );

  }


  function showList() {

    selectedIndex = null;

    document.getElementById("listView")
      .classList.remove("hidden");

    document.getElementById("detailView")
      .classList.add("hidden");

    document.getElementById("formView")
      .classList.add("hidden");

    renderHospitalList();

  }


  function renderHospitalList() {

    const hospitals = getHospitals();

    const list =
      document.getElementById("hospitalList");

    list.innerHTML = "";

    document.getElementById("emptyView")
      .classList.toggle(
        "hidden",
        hospitals.length > 0
      );


    hospitals.forEach(
      function(hospital, index) {

        const card =
          document.createElement("div");

        card.className =
          "card hospital-card";

        card.innerHTML = `
          <div class="hospital-name">
            🏥 ${escapeHtml(hospital.hospitalName)}
          </div>

          <div class="department">
            ${escapeHtml(hospital.department || "")}
          </div>

          <div class="label">
            診察券番号
          </div>

          <div class="value">
            ${escapeHtml(hospital.cardNumber || "未登録")}
          </div>
        `;

        card.onclick =
          function() {
            showDetail(index);
          };

        list.appendChild(card);

      }
    );

  }


  function showDetail(index) {

    const hospitals = getHospitals();

    const hospital = hospitals[index];

    if (!hospital) return;

    selectedIndex = index;

    document.getElementById("detailHospitalName")
      .textContent =
      "🏥 " + hospital.hospitalName;

    document.getElementById("detailDepartment")
      .textContent =
      hospital.department || "";

    document.getElementById("detailCardNumber")
      .textContent =
      hospital.cardNumber || "未登録";

    document.getElementById("detailHours")
      .textContent =
      hospital.hours || "未登録";

    document.getElementById("detailClosed")
      .textContent =
      hospital.closed || "未登録";

    document.getElementById("detailPhone")
      .textContent =
      hospital.phone || "未登録";

    document.getElementById("detailMemo")
      .textContent =
      hospital.memo || "なし";


    if (hospital.appointment) {

      const date =
        new Date(hospital.appointment);

      document.getElementById("detailAppointment")
        .textContent =
        date.toLocaleString(
          "ja-JP",
          {
            year: "numeric",
            month: "long",
            day: "numeric",
            hour: "2-digit",
            minute: "2-digit"
          }
        );

    } else {

      document.getElementById("detailAppointment")
        .textContent =
        "未登録";

    }


    document.getElementById("listView")
      .classList.add("hidden");

    document.getElementById("detailView")
      .classList.remove("hidden");

    document.getElementById("formView")
      .classList.add("hidden");

  }


  function showForm() {

    selectedIndex = null;

    clearForm();

    document.getElementById("formTitle")
      .textContent =
      "病院を登録";

    document.getElementById("listView")
      .classList.add("hidden");

    document.getElementById("detailView")
      .classList.add("hidden");

    document.getElementById("formView")
      .classList.remove("hidden");

  }


  function editHospital() {

    const hospitals = getHospitals();

    const hospital =
      hospitals[selectedIndex];

    if (!hospital) return;

    document.getElementById("formTitle")
      .textContent =
      "病院情報を編集";

    document.getElementById("hospitalName")
      .value =
      hospital.hospitalName || "";

    document.getElementById("department")
      .value =
      hospital.department || "";

    document.getElementById("cardNumber")
      .value =
      hospital.cardNumber || "";

    document.getElementById("hours")
      .value =
      hospital.hours || "";

    document.getElementById("closed")
      .value =
      hospital.closed || "";

    document.getElementById("phone")
      .value =
      hospital.phone || "";

    document.getElementById("appointment")
      .value =
      hospital.appointment || "";

    document.getElementById("memo")
      .value =
      hospital.memo || "";


    document.getElementById("detailView")
      .classList.add("hidden");

    document.getElementById("formView")
      .classList.remove("hidden");

  }


  function saveHospital() {

    const hospital = {

      hospitalName:
        document.getElementById("hospitalName")
        .value.trim(),

      department:
        document.getElementById("department")
        .value.trim(),

      cardNumber:
        document.getElementById("cardNumber")
        .value.trim(),

      hours:
        document.getElementById("hours")
        .value.trim(),

      closed:
        document.getElementById("closed")
        .value.trim(),

      phone:
        document.getElementById("phone")
        .value.trim(),

      appointment:
        document.getElementById("appointment")
        .value,

      memo:
        document.getElementById("memo")
        .value.trim()

    };


    if (!hospital.hospitalName) {

      alert("病院名を入力してください。");

      return;

    }


    const hospitals = getHospitals();


    if (selectedIndex === null) {

      hospitals.push(hospital);

    } else {

      hospitals[selectedIndex] =
        hospital;

    }


    saveHospitals(hospitals);

    showList();

  }


  function deleteHospital() {

    if (selectedIndex === null) return;

    const answer =
      confirm(
        "この病院の登録情報を削除しますか？"
      );

    if (!answer) return;


    const hospitals = getHospitals();

    hospitals.splice(
      selectedIndex,
      1
    );

    saveHospitals(hospitals);

    showList();

  }


  function cancelForm() {

    if (selectedIndex !== null) {

      showDetail(selectedIndex);

    } else {

      showList();

    }

  }


  function clearForm() {

    document.getElementById("hospitalName").value = "";
    document.getElementById("department").value = "";
    document.getElementById("cardNumber").value = "";
    document.getElementById("hours").value = "";
    document.getElementById("closed").value = "";
    document.getElementById("phone").value = "";
    document.getElementById("appointment").value = "";
    document.getElementById("memo").value = "";

  }


  function escapeHtml(text) {

    const div =
      document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

  }


  showList();

</script>

</body>
</html>
